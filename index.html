<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social App</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="auth-screen" class="auth-screen unauthenticated">

  <div class="auth-box">
    <h1>Welcome 👋</h1>
    <p>Connect with friends, creators & businesses</p>

    <!-- LOGIN -->
    <input type="email" id="login-email" placeholder="Email" />
    <input type="password" id="login-password" placeholder="Password" />
    <button onclick="login()">Login</button>

    <hr />

    <!-- SIGN UP -->
    <input type="email" id="signup-email" placeholder="New Email" />
    <input type="password" id="signup-password" placeholder="New Password" />
    <button class="secondary" onclick="signup()">Create Account</button>
  </div>

</div>

<!-- ================= APP ================= -->
<div id="app" class="authenticated hidden">

  <!-- ===== TOP NAV ===== -->
  <header class="top-nav">
    <h2 class="logo">Social</h2>

    <div class="nav-icons">
      <i class="fa-solid fa-house"></i>
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-solid fa-plus" id="openPost"></i>
      <i class="fa-solid fa-heart"></i>
      <i class="fa-solid fa-user"></i>
    </div>
  </header>

  <!-- ===== MAIN FEED ===== -->
  <main class="feed">

    <!-- CREATE POST -->
    <section class="create-post">
      <textarea id="postText" placeholder="What's on your mind?"></textarea>

      <div class="post-actions">
        <label>
          <i class="fa-solid fa-image"></i>
          <input type="file" id="postImage" hidden />
        </label>

        <label>
          <i class="fa-solid fa-video"></i>
          <input type="file" id="postVideo" hidden />
        </label>

        <button id="postBtn">Post</button>
      </div>
    </section>

    <!-- POSTS -->
    <section id="posts" class="posts"></section>

  </main>

  <!-- ===== BOTTOM NAV (MOBILE) ===== -->
  <nav class="bottom-nav">
    <i class="fa-solid fa-house"></i>
    <i class="fa-solid fa-users"></i>
    <i class="fa-solid fa-video"></i>
    <i class="fa-solid fa-comment"></i>
    <i class="fa-solid fa-wallet"></i>
  </nav>

</div>

<!-- LOGOUT -->
<button id="logoutBtn" class="logout-btn" onclick="logout()">Logout</button>

<!-- ================= JS ================= -->
<script type="module" src="./main.js"></script>

</body>
</html>
