<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hybrid Social App</title>

  <!-- THEME -->
  <meta name="theme-color" content="#ffffff" id="theme-color" />

  <!-- STYLES -->
  <link rel="stylesheet" href="style.css" />

  <!-- SUPABASE -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body data-theme="light">

  <!-- ================= AUTH SCREENS ================= -->
  <div id="auth-screen" class="screen hidden">
    <div class="auth-box">
      <h1>Welcome</h1>

      <input id="auth-email" type="email" placeholder="Email" />
      <input id="auth-password" type="password" placeholder="Password" />

      <button id="login-btn">Login</button>
      <button id="signup-btn">Sign Up</button>
    </div>
  </div>

  <!-- ================= MAIN APP ================= -->
  <div id="app" class="hidden">

    <!-- TOP BAR -->
    <header id="top-bar">
      <span id="app-title">Hybrid</span>
      <button id="theme-toggle">🌙</button>
    </header>

    <!-- MAIN CONTENT -->
    <main id="view-container">
      <!-- JS injects views here -->
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav id="bottom-nav">
      <button data-view="feed">🏠</button>
      <button data-view="reels">🎬</button>
      <button data-view="create">➕</button>
      <button data-view="notifications">🔔</button>
      <button data-view="profile">👤</button>
    </nav>
  </div>

  <!-- ================= MODALS ================= -->

  <!-- CREATE POST MODAL -->
  <div id="create-modal" class="modal hidden">
    <div class="modal-content">
      <textarea id="post-content" placeholder="What's on your mind?"></textarea>
      <button id="post-submit">Post</button>
      <button class="modal-close">Close</button>
    </div>
  </div>

  <!-- LOADER -->
  <div id="loader" class="hidden">Loading...</div>

  <!-- MAIN JS (ONLY ENTRY POINT) -->
  <script type="module" src="main.js"></script>

</body>
</html>
