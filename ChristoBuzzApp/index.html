
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChristoBuzz</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="supabase.js"></script>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash">
    <img src="assets/splash/splash.svg" alt="ChristoBuzz Splash" />
  </div>

  <!-- Auth UI -->
  <div id="auth-container">
    <h2>Sign In / Sign Up</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="signup-btn">Sign Up</button>
    <button id="signin-btn">Sign In</button>
    <button id="load-demo-btn">Load Demo Account</button>
  </div>

  <!-- Main App -->
  <div id="app" style="display:none;">
    <!-- Navigation -->
    <nav id="nav">
      <button data-view="feed">Feed</button>
      <button data-view="reels">Reels</button>
      <button data-view="marketplace">Marketplace</button>
      <button data-view="wallet">Wallet</button>
      <button data-view="profile">Profile</button>
      <button data-view="notifications">Notifications</button>
    </nav>

    <!-- Views -->
    <div id="views">
      <div id="feed-view" class="view"></div>
      <div id="reels-view" class="view"></div>
      <div id="marketplace-view" class="view"></div>
      <div id="wallet-view" class="view"></div>
      <div id="profile-view" class="view"></div>
      <div id="notifications-view" class="view"></div>
    </div>

    <!-- Ads -->
    <div id="ads-container"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
