<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChristoBuzz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon/icon-192.svg">
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="auth-container">
    <h1>Welcome to ChristoBuzz</h1>

    <!-- LOGIN -->
    <div class="auth-box" id="login-box">
      <h2>Login</h2>
      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Password">
      <button onclick="login()">Login</button>
      <p>Don't have an account? <span onclick="toggleSignup()">Sign Up</span></p>
    </div>

    <!-- SIGNUP -->
    <div class="auth-box hidden" id="signup-box">
      <h2>Sign Up</h2>
      <input type="text" id="signup-username" placeholder="Username">
      <input type="email" id="signup-email" placeholder="Email">
      <input type="password" id="signup-password" placeholder="Password">
      <input type="password" id="signup-confirm-password" placeholder="Confirm Password">
      <button onclick="signup()">Sign Up</button>
      <p>Already have an account? <span onclick="toggleLogin()">Login</span></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="hidden">

    <!-- NAVIGATION -->
    <nav class="navbar">
      <ul>
        <li data-tab="home" class="active">Home</li>
        <li data-tab="reels">Reels</li>
        <li data-tab="music">Music</li>
        <li data-tab="marketplace">Marketplace</li>
        <li data-tab="create">Create</li>
        <li data-tab="notifications">Notifications</li>
        <li data-tab="profile">Profile</li>
      </ul>
    </nav>

    <!-- TABS -->
    <div id="tab-content">
      <div id="home" class="tab active"></div>
      <div id="reels" class="tab"></div>
      <div id="music" class="tab"></div>
      <div id="marketplace" class="tab"></div>
      <div id="create" class="tab"></div>
      <div id="notifications" class="tab"></div>
      <div id="profile" class="tab"></div>
    </div>

    <!-- DEMO CONTENT LOADER -->
    <script type="module" src="demoController.js"></script>

  </div>

  <!-- SCRIPTS -->
  <script type="module" src="supabase.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
