<svg width="512" height="512" viewBox="0 0 512 512"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="hiveGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>

    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b6f7ff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#0f172a"/>

  <!-- Crystal above hive -->
  <polygon points="256,90 310,180 256,270 202,180"
           fill="url(#crystalGlow)" />

  <!-- Hive layers -->
  <g fill="url(#hiveGlow)">
    <polygon points="256,260 330,300 256,340 182,300"/>
    <polygon points="256,300 330,340 256,380 182,340"/>
    <polygon points="256,340 330,380 256,420 182,380"/>
  </g>

  <!-- Bees -->
  <circle cx="170" cy="260" r="12" fill="#ffcc00"/>
  <circle cx="350" cy="300" r="10" fill="#ffcc00"/>
  <circle cx="210" cy="410" r="9" fill="#ffcc00"/>

</svg>
