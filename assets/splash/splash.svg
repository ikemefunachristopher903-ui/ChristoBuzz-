    <circle r="70" fill="#ffcc00"/>
    <ellipse cx="-45" cy="-45" rx="22" ry="32" fill="#e5e7eb"/>
    <ellipse cx="45" cy="-45" rx="22" ry="32" fill="#e5e7eb"/>
  </g>

  <!-- Right Bee -->
  <g transform="translate(700,900)">
    <circle r="70" fill="#ffcc00"/>
    <ellipse cx="-45" cy="-45" rx="22" ry="32" fill="#e5e7eb"/>
    <ellipse cx="45" cy="-45" rx="22" ry="32" fill="#e5e7eb"/>
